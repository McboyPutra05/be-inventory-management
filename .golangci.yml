run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - gocritic
    - unused
    - ineffassign

linters-settings:
  govet:
    enable-all: false
  revive:
    severity: warning
  gosec:
    excludes:
      - G101 # Allow test secrets

